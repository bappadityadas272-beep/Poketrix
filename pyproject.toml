[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poketrix"
version = "0.1.0"
description = "Real-time probabilistic decision engine for competitive Pokémon (Gens 1-4 first)."
authors = [{ name = "Bappaditya Das" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "typing_extensions>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# The learned opponent model (Phase 7). Without it the turn engine uses heuristic-0.
ml = ["xgboost>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Timing tests depend on how busy the machine is, so they never gate a merge: the default run
# leaves them out, and `pytest -m timing` runs them on their own.
addopts = "-m 'not timing'"
markers = [
    "timing: asserts a latency budget; excluded by default, run with `pytest -m timing`",
    "slow: runs an evaluation over a whole fixture corpus (seconds, not milliseconds)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/poketrix/schemas/__init__.py" = ["F401"]  # deliberate re-exports
